# The real-engine compliance suite (uci-host/tests/real_engine_spec.rs) is the only part
# of the engine-protocol spec that a generated fake cannot answer, and it needs engines this
# repository may not ship (ADR-0001). So it runs here, on a schedule, with the binaries
# fetched at run time — and not in ci.yml, which stays offline and fails on no mirror
# (ADR-0009). A red run here means an engine changed under us, which is worth reading about
# in the morning and not worth blocking a pull request for.
name: real engines
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: engines
        run: echo "paths=$(bash scripts/fetch-engines.sh)" >> "$GITHUB_OUTPUT"
      - name: Drive three engines through the handshake suite
        env:
          SPITZ_ENGINES: ${{ steps.engines.outputs.paths }}
        run: |
          test -n "$SPITZ_ENGINES" || { echo "no engine answered a handshake" >&2; exit 1; }
          cargo test -p uci-host --locked --test real_engine_spec -- --nocapture --test-threads=1

  # The same engines, asked to be different strengths. `ladder` exits non-zero when an
  # adjacent pair fails to out-score the level below it, which is the only proof that the
  # twenty levels are twenty things and not one number with a slider.
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: engines
        run: echo "paths=$(bash scripts/fetch-engines.sh)" >> "$GITHUB_OUTPUT"
      - name: Measure that each level beats the one below it
        # A node budget, not a fixed depth: at depth 6 Stockfish is weaker than the top
        # levels ask to be, so the Elo cap never bites and levels 12 through 20 are the
        # same opponent, which the ladder reports as ~50% and calls unseparated.
        env:
          SPITZ_ENGINES: ${{ steps.engines.outputs.paths }}
          # Stockfish reads its whole network on every start; the ladder starts two per
          # pair, and the load is the slow part, not the search.
          SF_THREADS: 1
        run: |
          test -n "$SPITZ_ENGINES" || { echo "no engine answered a handshake" >&2; exit 1; }
          cargo run --release --locked -p ladder -- --games 40 --nodes 150000
